# Data contract — Lab Day 10 (tiếp nối artifact CS + IT Helpdesk)
# Sinh viên bổ sung owner, SLA freshness, và nguồn canonical.

version: "1.0"
dataset: "kb_chunk_export"
owner_team: "Clean/Quality Team"

schema_cleaned:
  chunk_id:
    type: string
    required: true
    description: "ID ổn định sau clean (thường hash hoặc doc_id + seq)"
  doc_id:
    type: string
    required: true
    description: "Khóa logic tài liệu nguồn (vd policy_refund_v4)"
  chunk_text:
    type: string
    required: true
    constraints:
      min_length: 8
  effective_date:
    type: date
    required: true
  exported_at:
    type: datetime
    required: true

quality_rules:
  - id: "min_one_row"
    severity: "halt"
  - id: "no_empty_doc_id"
    severity: "halt"
  - id: "doc_id_in_docs_allowlist"
    description: "Bắt buộc doc_id phải nằm trong danh mục tài liệu ở data/docs"
    severity: "halt"
  - id: "refund_no_stale_14d_window"
    description: "Không được để chunk policy refund chứa cửa sổ 14 ngày (lệch so với v4 = 7 ngày)"
    severity: "halt"
  - id: "chunk_min_length_8"
    severity: "warn"
  - id: "effective_date_iso_yyyy_mm_dd"
    description: "Ngày hiệu lực phải đúng định dạng parser regex YYYY-MM-DD"
    severity: "halt"
  - id: "effective_date_calendar_valid"
    description: "Ngày hiệu lực phải là ngày hợp lệ theo lịch thực tế"
    severity: "halt"
  - id: "exported_not_before_effective"
    description: "Thời điểm xuất file (exported_at) không được xảy ra trước ngày hiệu lực văn bản"
    severity: "halt"
  - id: "chunk_text_normalized_format"
    description: "Text phải sạch: không có thẻ HTML, phân dòng CRLF, dấu cách thừa"
    severity: "halt"
  - id: "hr_leave_no_stale_10d_annual"
    description: "Policy nhân sự không được chứa số liệu phép năm cũ (10 ngày)"
    severity: "halt"

freshness:
  measured_at: "publish"  # ingest | cleaned | publish
  sla_hours: 24
  alert_channel: "#oncall-data-latency"

canonical_sources:
  - path: "data/docs/policy_refund_v4.txt"
    doc_id: "policy_refund_v4"
  - path: "data/docs/sla_p1_2026.txt"
    doc_id: "sla_p1_2026"
  - path: "data/docs/it_helpdesk_faq.txt"
    doc_id: "it_helpdesk_faq"
  - path: "data/docs/hr_leave_policy.txt"
    doc_id: "hr_leave_policy"

# Baseline allowlist export — nhóm mở rộng doc mới phải đồng bộ cleaning_rules + contract.
allowed_doc_ids:
  - policy_refund_v4
  - sla_p1_2026
  - it_helpdesk_faq
  - hr_leave_policy

# Merit/Distinction: có thể đưa cutoff versioning vào env và tham chiếu ở đây (tránh hard-code trong code).
policy_versioning:
  hr_leave_min_effective_date: "2026-01-01"
